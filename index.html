<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. YOUR BROWSER TAB ICON (Favicon) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- 2. YOUR BROWSER TAB TITLE -->
    <title>Little Red Bird Publishing</title>

    <!-- 3. BASIC GOOGLE SEARCH DESCRIPTION -->
    <meta
      name="description"
      content="Guiding writers and professionals to authorship through full-service self-publishing, developmental editing, and dedicated book coaching."
    />

    <!-- 4. SOCIAL MEDIA PREVIEWS (LinkedIn, Facebook, Text Messages) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://littleredbirdpublishing.com/" />
    <meta property="og:title" content="Little Red Bird Publishing" />
    <meta
      property="og:description"
      content="Guiding writers and professionals to authorship through full-service self-publishing, developmental editing, and dedicated book coaching."
    />

    <!-- Note: You will want to upload a nice wide image (like your hero background) named 'social-preview.jpg' to your public folder later so an image pops up in the link preview! -->
    <meta
      property="og:image"
      content="https://littleredbirdpublishing.com/social-preview.jpg"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
